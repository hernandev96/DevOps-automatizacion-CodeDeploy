services:
  backend:
    container_name: backend
    image: ${ECR_REGISTRY}/calculadora/backend:${APP_VERSION:-latest}
    expose:
      - "8000"
    networks:
      - app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "python", "-c", "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/health').getcode()==200 else 1)" ]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - /var/log/calculadora:/var/log/calculadora
    command: [ "sh", "-c", "umask 000; uvicorn main:app --host 0.0.0.0 --port 8000 2>&1 | tee -a /var/log/calculadora/calculadora.log" ]

  frontend:
    container_name: frontend
    image: ${ECR_REGISTRY}/calculadora/frontend:${APP_VERSION:-latest}
    ports:
      - "80:8080"
      - "3000:8080"
    depends_on:
      - backend
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
    networks:
      - app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d:uid=101,mode=1777
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/log/calculadora:/var/log/calculadora
    command: [ "sh", "-c", "umask 000; /docker-entrypoint.sh nginx -g 'daemon off;' 2>&1 | tee -a /var/log/calculadora/calculadora.log" ]

networks:
  app:
    driver: bridge
