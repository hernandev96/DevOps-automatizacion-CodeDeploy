name: CI - Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/ci-terraform.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write # para comentar el plan en el PR

env:
  TF_DIR: ./infra/main
  TF_VERSION: "1.10.3"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  terraform-plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true # true aquí para poder capturar stdout fácil

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true # dejamos que el step "falle suave" para poder comentar en el PR

      - name: Guardar salida legible del plan
        id: plan_text
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform show -no-color tfplan > plan_output.txt 2>/dev/null || echo "No plan output" > plan_output.txt

      - name: Comentar el plan en el Pull Request
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan_output.txt', 'utf8').slice(0, 60000);
            const outcome = '${{ steps.plan.outcome }}';
            const body = `#### Terraform Plan: \`${outcome}\`
            <details><summary>Ver plan completo</summary>

            \`\`\`
            ${plan}
            \`\`\`
            </details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fallar el job si el plan falló
        if: steps.plan.outcome == 'failure'
        run: exit 1
